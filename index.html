<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nery Sports — Catálogo de Camisas de Time</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0b0b0c">
<meta name="description" content="Camisas de time, seleções e retrô com pronta entrega. Peça pelo WhatsApp.">
<meta property="og:title" content="Nery Sports — Catálogo de Camisas">
<meta property="og:description" content="Camisas de time, seleções e retrô. Escolha a sua e peça pelo WhatsApp.">
<meta property="og:image" content="https://nerysports.github.io/icon-512.png">
<meta property="og:url" content="https://nerysports.github.io/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--card:#151413;--line:#2c2924;--text:#efe9dc;--mut:#a59f92;--acc:#d6b161;--gold:linear-gradient(135deg,#f6dd9a 0%,#d6b161 45%,#a8792a 100%);--acc-ink:#141210}
*{box-sizing:border-box;margin:0;padding:0}
body{background-color:var(--bg);background-image:repeating-conic-gradient(rgba(255,255,255,.025) 0 25%,transparent 0 50%);background-size:6px 6px;color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{padding:22px 16px 10px;max-width:1200px;margin:0 auto}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;-webkit-tap-highlight-color:transparent}
.brand img{width:76px;height:76px;border-radius:16px;border:1px solid #3a3226;box-shadow:0 6px 24px rgba(214,177,97,.15)}
.brand h1{font-family:Montserrat,sans-serif;font-weight:900;font-size:26px;letter-spacing:.5px;text-transform:uppercase;line-height:1}
.brand h1 span{display:block;font-size:13px;font-weight:700;letter-spacing:.32em;margin-top:6px;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{color:var(--mut);font-size:12px;display:block;margin-top:6px}
.sub{color:var(--mut);font-size:13px;margin-top:6px}
.bar{position:sticky;top:0;z-index:5;background:rgba(11,11,12,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1200px;margin:0 auto;padding:10px 16px 8px}
.search{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;font-size:16px;font-family:inherit}
.search:focus{outline:2px solid var(--acc);outline-offset:-1px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--text);padding:7px 12px;border-radius:999px;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--gold);color:var(--acc-ink);border-color:#c9a24a;font-weight:700}
.chip.size{min-width:40px}
.lbl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin-right:2px;align-self:center;flex:none}
main{max-width:1200px;margin:0 auto;padding:12px 16px 60px}
.count{color:var(--mut);font-size:13px;margin:0}
.countbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 12px}
.per{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.per select{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;font-size:13px;font-weight:600}
.pager{display:flex;justify-content:center;align-items:center;gap:6px;margin:22px 0 4px;flex-wrap:wrap}
.pager button{min-width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.pager button.on{background:var(--gold);color:var(--acc-ink);border-color:#c9a24a}
.pager button:disabled{opacity:.35;cursor:default}
.pager span{color:var(--mut);padding:0 2px}
.sec{font-family:Montserrat,sans-serif;font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 10px}
.crumbs{font-size:13px;color:var(--mut);margin:6px 0 2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumbs a{color:var(--acc);text-decoration:none;font-weight:600}.crumbs b{color:var(--text)}
.tiles{display:grid;gap:10px;margin-bottom:8px}
.tiles.ligas{grid-template-columns:repeat(2,1fr)}
.tiles.times{grid-template-columns:repeat(3,1fr)}
@media(min-width:640px){.tiles.ligas{grid-template-columns:repeat(3,1fr)}.tiles.times{grid-template-columns:repeat(5,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--text);display:flex;flex-direction:column;overflow:hidden}
.tile.liga{padding:14px;gap:3px;background-image:linear-gradient(135deg,rgba(214,177,97,.14),transparent 60%);border-color:#3a3226}
.tile.liga .flag{display:block;width:36px;height:25px;margin-bottom:8px}
.tile.liga .flag svg{width:100%;height:100%;display:block;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.tile.liga b{font-family:Montserrat,sans-serif;font-weight:800;font-size:16px}
.tile.liga small{color:var(--mut);font-size:11.5px;line-height:1.3}
.tile.liga > span:last-child{margin-top:6px;font-size:11px;font-weight:600;color:var(--acc)}
.tile.team .tph{aspect-ratio:1;background:#fff}.tile.team img{width:100%;height:100%;object-fit:cover;display:block}
.tile.team .tt{padding:7px 8px 9px;display:flex;flex-direction:column;gap:1px}
.tile.team b{font-size:12.5px;line-height:1.2}.tile.team span{font-size:10.5px;color:var(--acc);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:14px}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(214,177,97,.08);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;color:inherit;font-family:inherit;padding:0}
.card .ph{aspect-ratio:1;background:#fff;position:relative}
.card img{width:100%;height:100%;object-fit:contain;display:block}
.tag{position:absolute;top:8px;left:8px;background:var(--gold);letter-spacing:.04em;color:var(--acc-ink);font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;text-transform:uppercase}
.card .nm{margin:9px 10px 6px;max-height:3.9em;font-size:13px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .sz{padding:2px 10px 10px;margin-top:auto;display:flex;gap:4px;flex-wrap:wrap}
.card .sz i{font-style:normal;font-size:10.5px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:60px 0}
footer{color:var(--mut);font-size:12px;text-align:center;padding:20px 16px 40px}
footer a{color:var(--acc)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:20;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
@media(min-width:640px){.modal{align-items:center}}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;max-height:94vh;overflow:auto}
@media(min-width:640px){.sheet{border-radius:18px}}
.sheet .big{background:#fff;aspect-ratio:1;position:relative}
.track{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.track img{flex:0 0 100%;width:100%;height:100%;object-fit:contain;scroll-snap-align:center}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:26px;line-height:1;cursor:pointer}
.nav.prev{left:8px}.nav.next{right:8px}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(0,0,0,.25);box-shadow:0 0 0 1px rgba(255,255,255,.6)}
.dots i.on{background:#d6b161;width:18px;border-radius:4px}
.nfo{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;font-weight:600;padding:2px 7px;border-radius:6px}
.x{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:20px;cursor:pointer}
.sheet .bd{padding:16px}
.sheet h2{font-size:18px;line-height:1.3}
.sheet .tags{display:flex;gap:6px;margin:10px 0}
.sheet .tags span{font-size:11px;background:var(--line);padding:3px 8px;border-radius:6px}
.sheet h3{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 8px}
.sizes{display:flex;gap:6px;flex-wrap:wrap}
.sizes button{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
.sizes button.on{background:var(--gold);border-color:#c9a24a;color:var(--acc-ink)}
.cta{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.btn{display:block;text-align:center;border-radius:12px;padding:14px;font-weight:700;font-size:15px;text-decoration:none;font-family:inherit;cursor:pointer;border:0}
.btn.p{background:var(--gold);color:var(--acc-ink)}
.btn.s{background:transparent;color:var(--text);border:1px solid var(--line)}
.hint{font-size:12px;color:var(--mut);margin-top:8px;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--gold);color:var(--acc-ink);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;z-index:30;display:none}
</style>
</head>

 "França":'<svg viewBox="0 0 30 21"><rect width="10" height="21" fill="#0055a4"/><rect x="10" width="10" height="21" fill="#fff"/><rect x="20" width="10" height="21" fill="#ef4135"/></svg>',
 "Portugal":'<svg viewBox="0 0 30 21"><rect width="30" height="21" fill="#da291c"/><rect width="12" height="21" fill="#046a38"/><circle cx="12" cy="10.5" r="4.2" fill="#ffe900"/><circle cx="12" cy="10.5" r="2.4" fill="#da291c"/></svg>',
 "Seleções":'<svg viewBox="0 0 30 21"><rect width="30" height="21" rx="2" fill="#1b1916"/><path d="M11 4h8v3.5a4 4 0 0 1-8 0zM11 5H8.5a2.6 2.6 0 0 0 2.6 3M19 5h2.5a2.6 2.6 0 0 1-2.6 3M14 11.4h2V14h-2zM12 14.5h6v2h-6z" fill="none" stroke="#d6b161" stroke-width="1.2" stroke-linejoin="round"/></svg>',
 "Resto do mundo":'<svg viewBox="0 0 30 21"><rect width="30" height="21" rx="2" fill="#1b1916"/><circle cx="15" cy="10.5" r="6.5" fill="none" stroke="#d6b161" stroke-width="1.2"/><ellipse cx="15" cy="10.5" rx="2.8" ry="6.5" fill="none" stroke="#d6b161" stroke-width="1"/><path d="M8.5 10.5h13M9.5 7h11M9.5 14h11" stroke="#d6b161" stroke-width="1"/></svg>'};
const slug = s => norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const ligaInfo = k => LIGAS.find(l=>l[0]===k) || [k,k,""];
let VIEW = {liga:null,time:null};
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  VIEW = {liga:null,time:null};
  if(h.startsWith("time-")){const p=ALL.find(p=>slug(p.time)===h.slice(5)); if(p) VIEW={liga:p.liga,time:p.time};}
  else if(h.startsWith("liga-")){const l=LIGAS.find(l=>slug(l[0])===h.slice(5)); if(l) VIEW={liga:l[0],time:null};}
  PAGE=1; renderView(); render(); window.scrollTo(0,0);
}
function inScope(p){ if(VIEW.time) return p.time===VIEW.time && p.liga===VIEW.liga; if(VIEW.liga) return p.liga===VIEW.liga; return true }
function teamTile(t,ps){const f=ps[0].fotos[0];return `<a class="tile team" href="#time-${slug(t)}"><div class="tph"><img loading="lazy" src="${f}" alt=""></div><div class="tt"><b>${esc(t)}</b><span>${ps.length} camisa${ps.length>1?"s":""}</span></div></a>`}
function renderView(){
  const cr=$("crumbs"), tl=$("tiles");
  if(!VIEW.liga){
    cr.hidden=true; $("tilesTitle").textContent="Escolha a liga"; $("secTiles").hidden=false;
    tl.className="tiles ligas";
    tl.innerHTML = LIGAS.map(([k,nm,sub])=>{const ps=ALL.filter(p=>p.liga===k); if(!ps.length)return "";
      const ts=[...new Set(ps.map(p=>p.time))];
      return `<a class="tile liga" href="#liga-${slug(k)}"><span class="flag">${FLAG[k]||""}</span><b>${esc(nm)}</b><small>${esc(sub)}</small><span>${ts.length} time${ts.length>1?"s":""} · ${ps.length} camisas</span></a>`}).join("");
    $("gridTitle").textContent="Todas as camisas";
  } else {
    const [k,nm]=ligaInfo(VIEW.liga);
    cr.hidden=false;
    cr.innerHTML = `<a href="#">‹ Início</a>` + (VIEW.time?` <span>/</span> <a href="#liga-${slug(k)}">${esc(nm)}</a> <span>/</span> <b>${esc(VIEW.time)}</b>`:` <span>/</span> <b>${esc(nm)}</b>`);
    if(VIEW.time){ $("secTiles").hidden=true; $("gridTitle").textContent=VIEW.time; }
    else {
      $("secTiles").hidden=false; $("tilesTitle").textContent = k==="Seleções"?"Escolha a seleção":"Escolha o time";
      tl.className="tiles times";
      const by={}; ALL.filter(p=>p.liga===k).forEach(p=>(by[p.time]=by[p.time]||[]).push(p));
      tl.innerHTML = Object.keys(by).sort((a,b)=>by[b].length-by[a].length||a.localeCompare(b)).map(t=>teamTile(t,by[t])).join("");
      $("gridTitle").textContent="Todas as camisas · "+nm;
    }
  }
}
window.addEventListener("hashchange",route);
$("home").addEventListener("click",e=>{ if(!location.hash||location.hash==="#"){e.preventDefault();window.scrollTo({top:0,behavior:"smooth"})} });
let PAGE=1, PER=24;
try{const v=localStorage.getItem("ns_per"); if(v!==null) PER=+v}catch(e){}
$("per").value=String(PER);
$("per").onchange=e=>{PER=+e.target.value; try{localStorage.setItem("ns_per",PER)}catch(_){} PAGE=1; render(); toGrid()};
function toGrid(){const y=$("gridTitle").getBoundingClientRect().top+window.scrollY-($(".bar")?.offsetHeight||0)-8; window.scrollTo({top:Math.max(0,y),behavior:"smooth"})}
function pages(cur,tot){const out=[];const add=n=>out.push(n);
  if(tot<=7){for(let i=1;i<=tot;i++)add(i);return out}
  add(1); if(cur>3)add("…"); for(let i=Math.max(2,cur-1);i<=Math.min(tot-1,cur+1);i++)add(i); if(cur<tot-2)add("…"); add(tot); return out}
function render(){
  const list = ALL.filter(p=>inScope(p)&&match(p));
  const tot = PER? Math.max(1,Math.ceil(list.length/PER)) : 1;
  if(PAGE>tot) PAGE=tot;
  const shown = PER? list.slice((PAGE-1)*PER, PAGE*PER) : list;
  $("count").textContent = `${list.length} camisa${list.length===1?"":"s"} disponíve${list.length===1?"l":"is"}` + (PER&&tot>1?` · página ${PAGE} de ${tot}`:"");
  $("empty").hidden = list.length>0;
  $("grid").innerHTML = shown.map(p=>{const b=badge(p);return `<button class="card" data-id="${p.id}"><div class="ph"><img loading="lazy" decoding="async" src="${p.fotos[0]}" alt="${esc(p.nome)}">${p.fotos.length>1?`<span class="nfo">${p.fotos.length} fotos</span>`:""}${b?`<span class="tag">${b}</span>`:""}</div><div class="nm">${esc(p.nome)}</div><div class="sz">${shortSizes(p).map(s=>`<i>${esc(s)}</i>`).join("")}</div></button>`}).join("");
  const pg=$("pager");
  if(!PER||tot<=1){pg.innerHTML="";return}
  pg.innerHTML = `<button data-p="${PAGE-1}" ${PAGE===1?"disabled":""} aria-label="Página anterior">‹</button>` +
    pages(PAGE,tot).map(n=>n==="…"?`<span>…</span>`:`<button data-p="${n}" class="${n===PAGE?"on":""}">${n}</button>`).join("") +
    `<button data-p="${PAGE+1}" ${PAGE===tot?"disabled":""} aria-label="Próxima página">›</button>`;
}
$("pager").onclick=e=>{const b=e.target.closest("button[data-p]");if(!b||b.disabled)return;PAGE=+b.dataset.p;render();toGrid()};
$("grid").onclick = e=>{const c=e.target.closest(".card");if(c)openP(c.dataset.id)};
let tq;$("q").oninput = e=>{clearTimeout(tq);tq=setTimeout(()=>{st.q=e.target.value.trim();PAGE=1;render()},120)};

let cur=null, curSize=null;
function openP(id){
  cur = ALL.find(p=>p.id===id); curSize=null; if(!cur)return;
  const tags=[...cur.temporada,...cur.versao];
  $("sheet").innerHTML = `<div class="big"><div class="track" id="track">${cur.fotos.map((f,i)=>`<img src="${f}" ${i>1?'loading="lazy"':''} alt="">`).join("")}</div><button class="x" id="x" aria-label="Fechar">×</button>${cur.fotos.length>1?`<button class="nav prev" id="prev" aria-label="Anterior">‹</button><button class="nav next" id="next" aria-label="Próxima">›</button><div class="dots" id="dots">${cur.fotos.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div>`:""}</div>
  <div class="bd"><h2>${esc(cur.nome)}</h2>${tags.length?`<div class="tags">${tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div>`:""}
  <h3>Tamanhos disponíveis</h3><div class="sizes" id="sz">${cur.tamanhos.map(s=>`<button data-s="${esc(s)}">${esc(s)}</button>`).join("")}</div>
  <div class="cta"><a class="btn p" id="order" href="#" target="_blank" rel="noopener">${WHATSAPP?"Pedir no WhatsApp":"Pedir no Instagram"}</a>
  <button class="btn s" id="copy">Copiar nome da camisa</button></div>
  <p class="hint">${WHATSAPP?"":"O nome da camisa é copiado ao tocar em Pedir — é só colar na conversa."}</p></div>`;
  $("modal").classList.add("open"); document.body.style.overflow="hidden";
  $("x").onclick=closeP; updOrder();
  if(cur.fotos.length>1){const t=$("track"),n=cur.fotos.length;
    const idx=()=>Math.round(t.scrollLeft/t.clientWidth);
    t.onscroll=()=>{const k=idx();[...$("dots").children].forEach((d,i)=>d.classList.toggle("on",i===k))};
    $("prev").onclick=()=>t.scrollTo({left:((idx()-1+n)%n)*t.clientWidth,behavior:"smooth"});
    $("next").onclick=()=>t.scrollTo({left:((idx()+1)%n)*t.clientWidth,behavior:"smooth"});}
  $("sz").onclick=e=>{const b=e.target.closest("button");if(!b)return;curSize=curSize===b.dataset.s?null:b.dataset.s;[...$("sz").children].forEach(x=>x.classList.toggle("on",x.dataset.s===curSize));updOrder()};
  $("copy").onclick=()=>copy(msg());
  $("order").onclick=()=>{ if(!WHATSAPP) copy(msg(),true) };
}
function msg(){return `Olá! Tenho interesse na ${cur.nome}${curSize?` — tamanho ${curSize}`:""}.`}
function updOrder(){ $("order").href = WHATSAPP?`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg())}`:`https://ig.me/m/${INSTAGRAM}`; }
function closeP(){$("modal").classList.remove("open");document.body.style.overflow=""}
$("modal").onclick=e=>{if(e.target.id==="modal")closeP()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeP()});
async function copy(t,quiet){try{await navigator.clipboard.writeText(t);toast(quiet?"Nome copiado — cole na conversa":"Copiado!")}catch(e){if(!quiet)toast("Não deu para copiar")}}
function toast(t){const el=$("toast");el.textContent=t;el.style.display="block";clearTimeout(el._t);el._t=setTimeout(()=>el.style.display="none",2200)}

fetch("data.json",{cache:"no-cache"}).then(r=>r.json()).then(d=>{
  ALL = d.produtos;
  const dt=new Date(d.atualizado);
  $("upd").textContent = "atualizado em "+dt.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"});
  renderChips(); route();
}).catch(()=>{$("upd").textContent="não foi possível carregar";});
</script>
